<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a6d">
<title>Frases em 3 línguas</title>
<style>
:root{--bg:#eef3f0;--card:#fff;--ink:#14302b;--mute:#5d746f;--line:#d3e0db;--acc:#1f7a6d;--accsoft:#cfe8e2;--on:#fff;--warn:#b3402e;
box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b18;--card:#162824;--ink:#e6f1ee;--mute:#93aca6;--line:#27403a;--acc:#4fb8a6;--accsoft:#1e3a34;--on:#0e1b18;--warn:#ff8c78}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.35rem;margin:4px 0 2px;font-weight:700}
.sub{color:var(--mute);margin:0 0 20px;font-size:.95rem}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0 18px}
#mic{width:112px;height:112px;border-radius:50%;border:0;background:var(--acc);color:var(--on);cursor:pointer;display:grid;place-items:center;position:relative}
#mic svg{width:44px;height:44px}
#mic.on::before,#mic.on::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--acc);animation:breathe 3.2s ease-out infinite}
#mic.on::after{animation-delay:1.6s}
@keyframes breathe{from{transform:scale(1);opacity:.7}to{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){#mic.on::before,#mic.on::after{animation:none;opacity:.5;transform:scale(1.25)}}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#hint{color:var(--mute);font-size:.95rem;min-height:1.4em;text-align:center}
#hint.err{color:var(--warn)}
textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;resize:vertical;min-height:72px}
.row{display:flex;gap:8px;margin:10px 0 0}
.btn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.main{background:var(--acc);color:var(--on);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px;margin-top:18px}
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-of-type{border-bottom:0}
.lang{width:30px;font-weight:700;color:var(--acc)}
.txt{flex:1}
.play{width:42px;height:42px;border-radius:50%;border:0;background:var(--accsoft);color:var(--acc);cursor:pointer;font-size:1rem}
h2{font-size:1.05rem;margin:30px 0 8px}
.lib-item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.lib-item .main{flex:1;min-width:0;cursor:pointer}
.lib-item .pt{font-weight:600}
.lib-item .en{color:var(--mute);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{border:0;background:none;color:var(--mute);font-size:1.3rem;cursor:pointer;padding:6px 10px}
.empty{color:var(--mute);padding:6px 2px}
.tools{display:flex;gap:8px;margin-top:14px}
.tools .btn{font-weight:500;font-size:.9rem;padding:10px}
</style>
</head>
<body>
<main>
  <h1>Frases em 3 línguas</h1>
  <p class="sub">Fale em português e ouça em inglês e francês.</p>

  <div class="mic-wrap">
    <button id="mic" aria-label="Falar uma frase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <div id="hint">Toque no microfone e fale</div>
  </div>

  <textarea id="input" placeholder="Ou digite a frase aqui" aria-label="Frase em português"></textarea>
  <div class="row"><button class="btn main" id="go">Traduzir e tocar</button></div>

  <div class="card" id="result" hidden></div>

  <h2>Minhas frases</h2>
  <div id="lib"></div>
  <div class="tools">
    <button class="btn" id="exp">Exportar backup</button>
    <button class="btn" id="imp">Importar backup</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</main>

<script>
const LANGS=[{k:'pt',tts:'pt-BR',label:'PT'},{k:'en',tts:'en-US',label:'EN'},{k:'fr',tts:'fr-FR',label:'FR'}];
const $=id=>document.getElementById(id);
const mic=$('mic'),input=$('input'),hint=$('hint'),result=$('result'),lib=$('lib');

/* Biblioteca local (IndexedDB) */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('frases',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  req(mode,fn){return new Promise((res,rej)=>{const q=fn(this.db.transaction('f',mode).objectStore('f'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  all(){return this.req('readonly',s=>s.getAll())},
  get(id){return this.req('readonly',s=>s.get(id))},
  put(o){return this.req('readwrite',s=>s.put(o))},
  del(id){return this.req('readwrite',s=>s.delete(id))}
};
const norm=t=>t.toLowerCase().replace(/\s+/g,' ').trim();
function say(msg,err){hint.textContent=msg;hint.className=err?'err':''}

/* Tradução (MyMemory, grátis e sem chave) */
const dec=document.createElement('textarea');
async function translate(text,to){
  const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=pt|'+to);
  const d=await r.json();
  if(d.responseStatus!=200)throw new Error(d.responseDetails||'Falha na tradução');
  dec.innerHTML=d.responseData.translatedText;
  return dec.value;
}

/* Voz (vozes do próprio aparelho) */
let voices=[];
const loadVoices=()=>{voices=speechSynthesis.getVoices()};
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(lang){
  const norm2=v=>v.lang.replace('_','-').toLowerCase();
  const pool=voices.filter(v=>norm2(v).startsWith(lang.slice(0,2).toLowerCase()));
  const exact=pool.filter(v=>norm2(v)===lang.toLowerCase());
  const list=(exact.length?exact:pool);
  return list.find(v=>!/compact/i.test(v.name)&&/google|enhanced|premium|natural/i.test(v.name))||list.find(v=>!/compact/i.test(v.name))||list[0];
}
function speak(text,lang){
  return new Promise(res=>{
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang;const v=pickVoice(lang);if(v)u.voice=v;
    u.rate=0.95;u.onend=res;u.onerror=res;
    speechSynthesis.speak(u);
  });
}
let playId=0;
async function playAll(item){
  speechSynthesis.cancel();
  const me=++playId;
  for(const l of LANGS){
    if(me!==playId)return;
    await speak(item[l.k],l.tts);
    await new Promise(r=>setTimeout(r,550));
  }
}
function playOne(item,k){
  speechSynthesis.cancel();playId++;
  const l=LANGS.find(x=>x.k===k);speak(item[k],l.tts);
}

/* Tela */
let current=null;
function showCurrent(item){
  current=item;result.hidden=false;
  result.innerHTML=LANGS.map(l=>`<div class="line"><span class="lang">${l.label}</span><span class="txt"></span><button class="play" data-k="${l.k}" aria-label="Tocar em ${l.label}">&#9654;</button></div>`).join('')
   +`<div class="row" style="margin-bottom:10px"><button class="btn main" id="again">Tocar tudo de novo</button></div>`;
  result.querySelectorAll('.txt').forEach((el,i)=>el.textContent=item[LANGS[i].k]);
}
result.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!current)return;
  if(b.id==='again')playAll(current);else if(b.dataset.k)playOne(current,b.dataset.k);
});
async function renderLib(){
  const items=(await DB.all()).sort((a,b)=>b.t-a.t);
  lib.innerHTML='';
  if(!items.length){lib.innerHTML='<div class="empty">As frases que você traduzir ficam salvas aqui.</div>';return}
  items.forEach(it=>{
    const d=document.createElement('div');d.className='lib-item';
    d.innerHTML='<div class="main"><div class="pt"></div><div class="en"></div></div><button class="del" aria-label="Apagar frase">&times;</button>';
    d.querySelector('.pt').textContent=it.pt;d.querySelector('.en').textContent=it.en;
    d.querySelector('.main').onclick=()=>{showCurrent(it);playAll(it);scrollTo({top:0,behavior:'smooth'})};
    d.querySelector('.del').onclick=async()=>{await DB.del(it.id);renderLib()};
    lib.appendChild(d);
  });
}

/* Fluxo principal */
async function run(){
  const text=input.value.trim();if(!text)return;
  const id=norm(text);
  let item=await DB.get(id);
  if(!item){
    say('Traduzindo...');
    try{
      const [en,fr]=await Promise.all([translate(text,'en'),translate(text,'fr')]);
      item={id,pt:text,en,fr,t:Date.now()};
      await DB.put(item);
    }catch(e){say('Não deu para traduzir. Confira a internet e tente de novo.',true);return}
  }
  say('Toque no microfone e fale');
  showCurrent(item);renderLib();playAll(item);
}
$('go').onclick=run;

let rec=null,listening=false;
mic.onclick=()=>{
  if(listening){rec.stop();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){say('Este navegador não reconhece voz. Digite a frase.',true);return}
  speechSynthesis.cancel();playId++;
  rec=new SR();rec.lang='pt-BR';rec.interimResults=true;rec.continuous=false;
  rec.onstart=()=>{listening=true;mic.classList.add('on');say('Ouvindo... fale a frase')};
  rec.onresult=e=>{input.value=[...e.results].map(r=>r[0].transcript).join('')};
  rec.onerror=e=>{
    const m={'not-allowed':'O navegador bloqueou o microfone para esta página.','service-not-allowed':'O reconhecimento de voz do aparelho está desligado (no iPhone, ative o Ditado).','no-speech':'Não ouvi nada. Tente de novo.','network':'Sem internet para reconhecer a voz.','audio-capture':'Não encontrei o microfone.'};
    say((m[e.error]||'Não consegui ouvir.')+' (código: '+e.error+')',true);
  };
  rec.onend=()=>{listening=false;mic.classList.remove('on');if(input.value.trim()&&!hint.classList.contains('err'))run()};
  hint.className='';rec.start();
};

/* Backup */
$('exp').onclick=async()=>{
  const blob=new Blob([JSON.stringify(await DB.all())],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='frases-backup.json';a.click();
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  try{
    const arr=JSON.parse(await e.target.files[0].text());
    for(const it of arr)if(it.id&&it.pt&&it.en&&it.fr)await DB.put(it);
    renderLib();say('Backup importado.');
  }catch(_){say('Arquivo de backup inválido.',true)}
  e.target.value='';
};

DB.open().then(renderLib).catch(()=>say('Não consegui abrir o armazenamento do navegador.',true));
</script>
</body>
</html>
